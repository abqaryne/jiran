plugins {
    id 'com.android.application'
    id 'checkstyle'
}

// Real Firebase configuration is supplied locally by the team, never invented.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace = 'com.jiran.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'jiran.com'
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName = '0.1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'FUNCTIONS_REGION', '"us-central1"'
        buildConfigField 'boolean', 'USE_FIREBASE_EMULATORS', 'false'
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'USE_FIREBASE_EMULATORS', 'true'
        }
        liveDebug {
            initWith debug
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'USE_FIREBASE_EMULATORS', 'false'
        }
    }
    sourceSets {
        liveDebug.java.srcDirs = ['src/release/java']
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    testBuildType = providers.gradleProperty('firebaseTestBuildType').getOrElse('debug')
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint { abortOnError = true }
}

def verifyLiveFirebase = tasks.register('verifyLiveFirebase') {
    doLast {
        if (!file('google-services.json').exists()) {
            throw new GradleException('Live builds require app/google-services.json for jiran-mad.')
        }
        def config = new groovy.json.JsonSlurper().parse(file('google-services.json'))
        def projectId = config.project_info?.project_id
        if (projectId != 'jiran-mad') {
            throw new GradleException('Live builds require the jiran-mad project configuration.')
        }
        def matchingClient = config.client?.find {
            it.client_info?.android_client_info?.package_name == 'jiran.com'
        }
        if (!matchingClient) {
            throw new GradleException('Firebase configuration must include Android package jiran.com.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild' || name == 'preLiveDebugBuild') {
        dependsOn verifyLiveFirebase
    }
}

checkstyle { toolVersion = '10.26.1' }
tasks.register('checkstyleMain', Checkstyle) {
    source 'src'
    include '**/*.java'
    classpath = files()
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}
tasks.named('check') { dependsOn 'checkstyleMain' }

dependencies {
    // Product UI: Material Components, navigation, MVVM (the design system in docs/design/DESIGN.md is built on these)
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.navigation:navigation-ui:2.10.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.firebase:firebase-storage'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
