name: Jiran checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker-feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/worker-feasibility/package-lock.json
      - run: npm ci --prefix experiments/worker-feasibility
      - run: npm test --prefix experiments/worker-feasibility
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic
      - run: bash ./gradlew lintDebug testDebugUnitTest checkstyleMain assembleDebug --console=plain
        working-directory: android
  backend:
    runs-on: ubuntu-latest
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: '30'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci --prefix backend/functions
      - run: npm test --prefix backend/functions
      - run: npm run test:load --prefix backend/functions
      - run: npm run check --prefix backend/functions
      - run: npm install --global firebase-tools@15.34.1
      - run: firebase emulators:exec --project demo-jiran --only auth,firestore,functions,storage 'node scripts/emulator-smoke.cjs'
        working-directory: backend
