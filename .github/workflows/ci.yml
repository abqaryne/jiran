name: Jiran checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android
      - run: bash ./gradlew lintDebug testDebugUnitTest checkstyleMain assembleDebug --console=plain
        working-directory: android
  backend:
    runs-on: ubuntu-latest
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci --prefix backend/functions
      - run: npm test --prefix backend/functions
      - run: npm run check --prefix backend/functions
      - run: npm install --global firebase-tools@15.34.1
      - run: firebase emulators:exec --project demo-jiran --only auth,firestore,functions,storage 'node scripts/emulator-smoke.cjs'
        working-directory: backend
