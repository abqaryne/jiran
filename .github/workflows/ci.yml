name: Jiran checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker-feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/worker-feasibility/package-lock.json
      - run: npm ci --prefix experiments/worker-feasibility
      - run: npm test --prefix experiments/worker-feasibility
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew lintDebug testDebugUnitTest checkstyleMain assembleDebug --console=plain
  backend:
    runs-on: ubuntu-latest
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      - run: npm run check --prefix functions
      - run: npm install --global firebase-tools@15.34.1
      - run: firebase emulators:exec --project demo-jiran --only auth,firestore,functions,storage 'node scripts/emulator-smoke.cjs'
